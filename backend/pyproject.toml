[project]
name = "backend"
version = "0.1.0"
description = "Multi-Agent Debate backend: debate engine, API, and ML pipeline"
readme = "README.md"
authors = [
    { name = "ArYaN203", email = "agrawal.aryan017@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.110.3",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
]

[project.scripts]
mad = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
