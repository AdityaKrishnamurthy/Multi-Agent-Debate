# Model configuration — 002 §Model backends
# Model IDs live only in this config file and are never hard-coded.
# Groq models confirmed live via https://api.groq.com/openai/v1/models.

profiles:
  groq:
    provider: groq
    models:
      judge: "openai/gpt-oss-120b"
      debater: "openai/gpt-oss-20b"
      moderator: "openai/gpt-oss-20b"
      critic: "qwen/qwen3.8-27b"
      scholar: "qwen/qwen3.8-27b"
      explorer: "openai/gpt-oss-20b"
  kaggle:
    provider: hosted_vllm
    base_url: "http://localhost:8000/v1"
    models:
      judge: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      debater: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      moderator: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      critic: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      scholar: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      explorer: "Qwen/Qwen2.5-7B-Instruct-AWQ"
  local:
    provider: ollama
    base_url: "http://localhost:11434"
    models:
      judge: "qwen2.5:3b"
      debater: "qwen2.5:3b"
      moderator: "qwen2.5:3b"
      critic: "qwen2.5:3b"
      scholar: "qwen2.5:3b"
      explorer: "qwen2.5:3b"

# When every key for a provider is rate-limited, calls switch to these models
# (only if that provider has a key in .env). Model IDs are full LiteLLM ids.
fallbacks:
  groq:
    - "mistral/ministral-14b-latest"
  mistral:
    - "groq/openai/gpt-oss-20b"

# Client-side pacing (requests per minute) for models with very low free-tier limits.
# Mistral's free tier: 2 requests/minute per model; mistral-small/medium and
# magistral are 0/minute on the free tier, so they are not used.
rate_limits:
  "mistral/ministral-14b-latest": 2

# Models offered in the UI for the debaters. Each one was tested with structured
# debate calls (valid JSON 4/4). Entries whose provider has no key in .env are hidden.
debate_models:
  - id: "groq/openai/gpt-oss-20b"
    label: "GPT-OSS 20B"
    provider: "Groq"
    note: "Fast. The default."
  - id: "groq/openai/gpt-oss-120b"
    label: "GPT-OSS 120B"
    provider: "Groq"
    note: "Strongest reasoning; uses more of the rate limit."
  - id: "groq/qwen/qwen3.8-27b"
    label: "Qwen 3.8 27B"
    provider: "Groq"
    note: "A different model family from the judge."
  - id: "mistral/ministral-14b-latest"
    label: "Ministral 14B"
    provider: "Mistral"
    note: "Free tier allows 2 calls a minute, so debates take longer."

defaults:
  profile: groq
  temperature: 0.7
  max_tokens: 2048
  max_retries: 1
  backoff_base: 2.0
